{% extends 'base.html' %}

{%block title %} Crear Medico {% endblock %}

{% block content %}
    <h1>Registro Medico</h1>
    <form action="{{ url_for('medico.create') }}" method="POST">

        <div class="mb-3">
            <label for="" class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" required>
        </div>
        <div class="mb-3">
            <label for="especialidad" class="form-label">Especialidad</label>
            <input type="text" class="form-control" name="especialidad" required>
        </div>
        <div class="mb-3">
            <label for="telefono" class="form-label">Telefono</label>
            <input type="text" class="form-control" name="telefono" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
            <label for="" class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>            
        </div>
        <button type="submit" class="btn btn-primary">Registrar Medico</button>
            
    </form>
{% endblock %}
