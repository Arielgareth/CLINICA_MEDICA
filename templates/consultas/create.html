{% extends 'base.html' %}

{%block title %} Crear Consulta {% endblock %}

{% block content %}
    <h1>Registro Consulta</h1>
    <form action="{{ url_for('consulta.create') }}" method="POST">

        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" name="fecha" required>
        </div>
        <div class="mb-3">
            <label for="diagnostico" class="form-label">Diagnóstico</label>
            <input type="text" class="form-control" name="diagnostico" required>
        </div>
        <div class="mb-3">
            <label for="tratamiento" class="form-label">Tratamiento</label>
            <input type="text" class="form-control" name="tratamiento" required>
        </div>
        <div class="mb-3">
            <label for="" class="form-label">Paciente</label>
            <select name="id_paciente" class="form-control" required>
                <option value="">Seleccione un paciente</option>
                {% for paciente in pacientes %}
                    <option value="{{ paciente.id }}">{{ paciente.nombre }}</option>
                {% endfor %}
            </select>
                
        </div>
        <div class="mb-3">
            <label for="" class="form-label">Medico</label>
            <select name="id_medico" class="form-control" required>
                <option value="">Seleccione un médico</option>
                {% for medico in medicos %}
                    <option value="{{ medico.id }}">{{ medico.nombre }}</option>
                {% endfor %}
            </select>
        </div>
           
        <button type="submit" class="btn btn-primary">Registrar Consulta</button>
            
    </form>
{% endblock %}
